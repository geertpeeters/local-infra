services:
  omniroute-redis:
    image: docker.io/library/redis:7-alpine
    container_name: omniroute-redis
    restart: unless-stopped
    volumes:
      - ${OMNIROUTE_PERSIST_DIR}/redis:/data
    command: redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
#    healthcheck:
#      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
#      interval: 30s
#      timeout: 3s
#      retries: 3
    networks:
      - infra-net

  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: omniroute
    restart: unless-stopped
    stop_grace_period: 40s

    environment:
      - DATA_DIR=/app/data
      - PORT=${OMNIROUTE_DASHBOARD_PORT:-20128}
      - DASHBOARD_PORT=${OMNIROUTE_DASHBOARD_PORT:-20128}
      - API_PORT=${OMNIROUTE_API_PORT:-20129}
      - API_HOST=0.0.0.0
      - REDIS_URL=redis://:${REDIS_PASSWORD}@omniroute-redis:6379
        #ports:
    #  - "127.0.0.1:${OMNIROUTE_DASHBOARD_PORT:-20128}:${OMNIROUTE_DASHBOARD_PORT:-20128}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.omniroute.rule=Host(`omniroute.test`)"
      - "traefik.http.routers.omniroute.entrypoints=web"
      - "traefik.http.services.omniroute.loadbalancer.server.port=20128"
#    healthcheck:
#        test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:20128/ || wget -qO- http://127.0.0.1:20128/ || exit 1"]
#        interval: 30s
#        timeout: 5s
#        retries: 3
#        start_period: 15s
    volumes:
      - ${OMNIROUTE_PERSIST_DIR}/data:/app/data
    depends_on:
      - omniroute-redis
    networks:
      - infra-net

networks:
  infra-net:
    external: true
