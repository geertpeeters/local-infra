services:
  opencode:
    build:
      context: .
      dockerfile: Dockerfile
      pull: true
    image: opencode-local
    container_name: opencode
    restart: unless-stopped
    working_dir: /workspace

    # Base image heeft een eigen entrypoint; leegmaken zodat command direct draait.
    entrypoint: []
    command: ["opencode", "serve", "--hostname", "0.0.0.0", "--port", "4096"]

    environment:
      - OPENCODE_SERVER_USERNAME=${OPENCODE_SERVER_USERNAME:-opencode}
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD}

    volumes:
      - ${OPENCODE_PERSIST_DIR}/data:/home/opencode/.local
      - ${OPENCODE_PERSIST_DIR}/config:/home/opencode/.config/opencode
      - ${OPENCODE_PERSIST_DIR}/projects:/workspace
#    healthcheck:
#           test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4096/ || wget -qO- http://127.0.0.1:4096/ || exit 1"]
#           interval: 30s
#           timeout: 5s
#           retries: 3
#           start_period: 20s
    networks:
      - infra-net

    # Alleen nodig tijdens debuggen — weghalen zodra Traefik bevestigd werkt
    # ports:
    #   - "127.0.0.1:4096:4096"

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.opencode.rule=Host(`opencode.test`)"
      - "traefik.http.routers.opencode.entrypoints=web"
      - "traefik.http.services.opencode.loadbalancer.server.port=4096"

networks:
  infra-net:
    external: true
