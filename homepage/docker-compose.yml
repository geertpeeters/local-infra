services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=homepage.test
    volumes:
      - ${HOMEPAGE_PERSIST_DIR}/config:/app/config
    networks:
      - infra-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homepage.rule=Host(`homepage.test`)"
      - "traefik.http.routers.homepage.entrypoints=web"
      - "traefik.http.services.homepage.loadbalancer.server.port=3000"
#    healthcheck:
#        test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ || wget -qO- http://127.0.0.1:3000/ || exit 1"]
#        interval: 30s
#        timeout: 5s
#        retries: 3
#        start_period: 20s
networks:
  infra-net:
    external: true
