services:
  hermes-agent:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-agent
    command: gateway run
    ports:
      - "127.0.0.1:8642:8642"
    volumes:
      - hermes-home:/home/hermes/.hermes
      - hermes-agent-src:/opt/hermes
    environment:
      - HERMES_HOME=/home/hermes/.hermes
      - HERMES_UID=${UID:-1000}
      - HERMES_GID=${GID:-1000}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
    restart: unless-stopped
    networks:
      - hermes-net

  hermes-webui:
    image: ghcr.io/nesquena/hermes-webui:latest
    container_name: hermes-webui
    depends_on:
      - hermes-agent
    ports:
      - "127.0.0.1:4545:8787"
    env_file:
      - .env
    volumes:
      - hermes-home:/home/hermeswebui/.hermes
      - hermes-agent-src:/home/hermeswebui/.hermes/hermes-agent:ro
      - ${HERMES_PERSIST_DIR}/workspace:/workspace
      - ${HERMES_PERSIST_DIR}/wiki:/wiki
    environment:
      - HERMES_WEBUI_HOST=0.0.0.0
      - HERMES_WEBUI_PORT=8787
      - HERMES_WEBUI_STATE_DIR=/home/hermeswebui/.hermes/webui
      - HERMES_API_URL=http://hermes-agent:8642
      - WANTED_UID=${UID:-1000}
      - WANTED_GID=${GID:-1000}
      - WIKI_PATH=/wiki
      - HERMES_WEBUI_AUTO_INSTALL=1
      - HERMES_SKIP_CHMOD=1
    restart: unless-stopped
    networks:
      - hermes-net

networks:
  hermes-net:
    driver: bridge

volumes:
  hermes-home:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HERMES_PERSIST_DIR}
  hermes-agent-src:
