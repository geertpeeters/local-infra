services:
  trilium-mcp:
    build:
      context: https://github.com/perfectra1n/triliumnext-mcp.git#71818e8f6877d203c31020fc100a0f22bc435cf7
    container_name: trilium-mcp
    restart: unless-stopped

    environment:
      TRILIUM_URL: http://trilium:8080/etapi
      TRILIUM_TOKEN: ${TRILIUM_API_TOKEN}
      TRILIUM_TRANSPORT: http
      TRILIUM_HTTP_PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - infra-net
#    healthcheck:
#        test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ || wget -qO- http://127.0.0.1:3000/ || exit 1"]
#        interval: 30s
#        timeout: 5s
#        retries: 3
#        start_period: 20s
networks:
  infra-net:
    external: true
